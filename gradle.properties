# ---------- JVM ----------
# 建议 4G 以上；JVM 参数过小会导致 KSP/Hilt 编译失败
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ---------- Gradle 性能 ----------
org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存能显著加快二次构建，但 AGP 某些版本与它配合不佳。
# 如果遇到离奇的配置阶段报错，先把这里改成 false 试试。
org.gradle.configuration-cache=true

# ---------- AndroidX ----------
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------- Kotlin ----------
kotlin.code.style=official
# 中文资源在 Windows 上需显式指定编码，否则可能乱码
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ---------- 项目路径含中文的处理 ----------
# AGP 检测到项目路径含非 ASCII 字符时会直接报错终止。
# 开启此开关可跳过该检查。
#
# ⚠️ 这只是跳过检查，底层问题依然存在：
#    AAPT2 资源编译、NDK、Gradle worker 都可能因中文路径失败。
# 正式开发强烈建议把项目移到纯英文路径，详见 docs/P6-打包APK.md
android.overridePathCheck=true
