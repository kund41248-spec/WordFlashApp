distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# ---------------------------------------------------------------
# Gradle 发行版下载地址
#
# 官方地址 services.gradle.org 在国内基本连不上，
# 实测会卡在下载阶段导致 Android Studio 同步失败：
#   Could not install Gradle distribution from
#   'https://services.gradle.org/distributions/gradle-8.9-bin.zip'
#
# 因此改用国内镜像。以下两个都实测可用（129.8 MB）：
#   腾讯云   https://mirrors.cloud.tencent.com/gradle/
#   华为云   https://mirrors.huaweicloud.com/gradle/
#
# 若镜像失效，可换回官方地址：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
# 或指向本地文件：
#   distributionUrl=file\:///D:/gradle-8.9-bin.zip
#
# ⚠️ 执行 `gradle wrapper` 命令会把这个文件重置回官方地址，
#    每次跑完 wrapper 任务都要回来检查这一行。
# ---------------------------------------------------------------
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip

networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
